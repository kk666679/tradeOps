# pnpm build-script approval (pnpm 11+ / 12).
# These are legitimate native/engine packages that MUST run their install and
# build scripts; otherwise their compiled binaries are never produced and
# `nest build`, Prisma, and tsx/esbuild crash (the SIGTERM/SIGKILL seen at build).
# Values must be real booleans (true = build, false = deny), NOT the pnpm
# placeholder text.
allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  unrs-resolver: true
