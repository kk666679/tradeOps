  <circle cx="52" cy="632" r="9" fill="#0e927e"/><text x="72" y="638" font-family="Arial,sans-serif" font-size="16" fill="#365363">Hijau teal — aliran, kelancaran, kemudahan</text>
  <text x="40" y="700" font-family="Arial,sans-serif" font-size="14" fill="#607582">Ikon vektor tersuai • Boleh diskalakan • Sesuai untuk portal web dan menu navigasi</text>
