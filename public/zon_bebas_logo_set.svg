<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Zon Bebas Malaysia — set ikon SVG</title>
  <desc id="desc">Set ikon vektor untuk portal Senarai Zon Bebas dan Pihak Berkuasa Zon Bebas.</desc>
  <defs>
    <style>
      .bg{fill:#f4f7f9}.tile{fill:#fff;stroke:#d8e2e8;stroke-width:2}
      .ink{fill:none;stroke:#123b5d;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .accent{fill:none;stroke:#0e927e;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .solid{fill:#123b5d}.green{fill:#0e927e}
      .label{font:600 20px Arial,sans-serif;fill:#17364c;text-anchor:middle}
      .sub{font:14px Arial,sans-serif;fill:#5a6d79;text-anchor:middle}
    </style>
  </defs>
  <rect class="bg" width="1200" height="760" rx="24"/>
  <g transform="translate(40 30)">
