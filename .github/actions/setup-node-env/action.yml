name: Setup Node Env
description: Install Node, restore npm cache, install root (and optionally backend) dependencies.

inputs:
  node-version:
    description: Node.js version
    required: false
    default: '20.18.1'
  enable-backend:
    description: Also install backend dependencies
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Set up Node.js ${{ inputs.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: |
          package-lock.json
          backend/package-lock.json

    - name: Install root dependencies
      shell: bash
      run: npm ci

    - name: Install backend dependencies
      if: ${{ inputs.enable-backend == 'true' }}
      shell: bash
      working-directory: backend
      run: npm ci