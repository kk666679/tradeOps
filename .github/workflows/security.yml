name: Security

on:
  push:
    branches: [main]
    paths:
      - '**.ts'
      - '**.tsx'
      - '**.js'
      - '**.json'
      - '**.prisma'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'backend/package.json'
      - 'backend/package-lock.json'
      - '.github/workflows/security.yml'
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node env (root + backend)
        uses: ./.github/actions/setup-node-env
        with:
          node-version: '22.12.0'
          enable-backend: 'true'

      - name: Audit root dependencies
        run: pnpm audit --json > audit-root.json || true

      - name: Audit backend dependencies
        run: npm audit --json > audit-backend.json || true
        working-directory: backend

      - name: Summarise audit results
        if: always()
        run: |
          node -e "
            const fs = require('fs');
            const files = ['audit-root.json', 'backend/audit-backend.json'];
            let total = 0;
            for (const f of files) {
              try {
                const data = JSON.parse(fs.readFileSync(f, 'utf8'));
                const counts = data.metadata?.vulnerabilities || {};
                console.log(f, JSON.stringify(counts));
                total += (counts.high || 0) + (counts.critical || 0);
              } catch (e) { console.log(f, 'no report'); }
            }
            if (total > 0) { console.log('High/Critical vulnerabilities found — review audit reports'); }
          "

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-audit
          path: |
            audit-root.json
            backend/audit-backend.json
          retention-days: 14

  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --no-banner --redact=10