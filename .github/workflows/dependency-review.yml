name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Review dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4  # 11d5960a326750d5838078e36cf38b85af677262

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4  # TODO: pin to full commit SHA via .github/workflows/dependency-update.yml
        with:
          fail-on-severity: high
          fail-on-non-prod: false
          allow-licenses: |
            MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD, Unlicense

  license-compliance:
    name: License compliance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4  # 11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node env (root + backend)
        uses: ./.github/actions/setup-node-env
        with:
          node-version: '22.12.0'
          enable-backend: true

      - name: Generate license report (root)
        run: npm ls --all --json > npm-ls-root.json 2>/dev/null || true

      - name: Generate license report (backend)
        run: npm ls --all --json > npm-ls-backend.json 2>/dev/null || true
        working-directory: backend

      - name: Upload license reports
        if: always()
        uses: actions/upload-artifact@v4  # ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: npm-license-report
          path: |
            npm-ls-root.json
            backend/npm-ls-backend.json
          retention-days: 14