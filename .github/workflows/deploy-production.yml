name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to deploy (e.g. 0.1.8)'
        required: true
        default: '0.1.8'
        type: string
      require-approval:
        description: 'Require environment protection rules'
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write
  # Needed so the summary step can post a commit status.
  statuses: write

concurrency:
  group: deploy-production
  # Never cancel an in-flight production deploy — let it finish or fail cleanly.
  cancel-in-progress: false

env:
  ENVIRONMENT: production

jobs:
  precheck:
    name: Pre-deploy validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # getReleaseByTag requires contents:read — already granted at workflow level,
      # but pinned here so the intent is explicit.
    steps:
      - name: Verify release exists
        uses: actions/github-script@10b53a9ec6c222bb4ce97aa6bd2b5f739696b536  # v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const version = '${{ github.event.inputs.version }}';
            const tag = `v${version}`;
            try {
              const release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
              console.log(`Release ${tag} exists: ${release.data.name}`);
              console.log(`Assets: ${release.data.assets.map(a => a.name).join(', ')}`);
            } catch (e) {
              core.setFailed(`Release ${tag} not found. Create it with the Release workflow first.`);
            }

      - name: Verify staging health
        run: |
          echo "Confirm staging is healthy before promoting to production..."
          # Integration point — replace with your actual check.
          # Example:
          #   curl -fsS https://staging.cfs.example.com/api/ready || exit 1
          echo "Staging health check is a manual gate in this integration point."

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: precheck
    environment:
      name: production
      url: https://cfs.example.com
    steps:
      # ---------------------------------------------------------------
      # 1. Resolve inputs
      # ---------------------------------------------------------------
      - name: Resolve inputs
        id: inputs
        run: |
          VERSION="${{ github.event.inputs.version }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image-tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Deploying version $VERSION to production"

      # ---------------------------------------------------------------
      # 2. Checkout the tag so downstream steps (and createCommitStatus)
      #    have a real commit SHA available as context.sha.
      # ---------------------------------------------------------------
      - name: Checkout release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: v${{ steps.inputs.outputs.version }}
          fetch-depth: 1

      # ---------------------------------------------------------------
      # 3. Download build artifacts (may not exist for every release)
      # ---------------------------------------------------------------
      - name: Download release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        continue-on-error: true
        with:
          name: release-artifacts
          path: /tmp/artifacts

      # ---------------------------------------------------------------
      # 4. Migrations — separate step, forward-only
      # ---------------------------------------------------------------
      - name: Run migrations (forward-only)
        # Migrations run as a pre-deploy job. Forward-only by policy.
        # Requires DATABASE_URL (production) in the production environment.
        run: |
          echo "Running Prisma migrations against production database..."
          # Integration point — replace with your actual migration runner.
          # Example:
          #   cd /tmp/artifacts && pnpm install --frozen-lockfile --ignore-scripts && npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

      # ---------------------------------------------------------------
      # 5. Deploy
      # ---------------------------------------------------------------
      - name: Deploy
        run: |
          echo "Deploying image ${{ steps.inputs.outputs.image-tag }} to production..."
          # Integration point — replace with your actual deploy command.
          # Examples:
          #   - Kubernetes:    kubectl set image deploy/web web=cfs-wms:web-${{ steps.inputs.outputs.image-tag }}
          #   - Docker Compose: docker compose -f docker-compose.prod.yml up -d
          #   - Vercel:         npx vercel deploy --prod
          echo "Production deploy integration point configured."

      # ---------------------------------------------------------------
      # 6. Health check
      # ---------------------------------------------------------------
      - name: Health check
        run: |
          echo "Waiting for production deployment to become healthy..."
          # Integration point — replace with your actual health check.
          # Example:
          #   for i in $(seq 1 30); do
          #     curl -fsS https://cfs.example.com/api/ready && break
          #     sleep 5
          #   done
          curl -fsS "${{ secrets.PRODUCTION_HEALTH_URL }}" || {
            echo "Health check failed — consider rollback";
            exit 1;
          }

      # ---------------------------------------------------------------
      # 7. Deployment summary — uses context.sha (a real commit SHA),
      #    and posts the body as a commit comment so it's discoverable.
      # ---------------------------------------------------------------
      - name: Deployment summary
        if: always()
        uses: actions/github-script@10b53a9ec6c222bb4ce97aa6bd2b5f739696b536  # v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const conclusion = '${{ job.status }}';
            const version = '${{ steps.inputs.outputs.version }}';
            const body = `## Production deployment ${conclusion}

            - **Version:** \`${version}\`
            - **Environment:** production
            - **Triggered by:** ${github.actor}
            - **Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}

            ### Rollback
            If this deployment fails, roll back to the previous release:

            \`\`\`bash
            # Re-run the Deploy Production workflow with the previous version number
            \`\`\``;

            // Post the body as a commit comment so it shows on the tag's commit.
            try {
              await github.rest.repos.createCommitComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.sha,
                body,
              });
            } catch (e) {
              core.warning(`Could not post commit comment: ${e.message}`);
            }

            // Status badge on the deployed commit.
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: conclusion === 'success' ? 'success' : 'failure',
              context: 'deploy/production',
              description: `Production deploy ${conclusion}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });