name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.2.0)'
        required: true
        default: '0.2.0'
        type: string
      channel:
        description: 'Release channel'
        required: true
        default: 'stable'
        type: choice
        options: [stable, beta]

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            TAG="v${VERSION}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=${{ inputs.channel || 'stable' }}" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $TAG, version: $VERSION"

      - name: Verify tag matches package version
        run: |
          ROOT_VERSION=$(node -e "console.log(require('./package.json').version)")
          BACKEND_VERSION=$(node -e "console.log(require('./backend/package.json').version)")
          echo "Root package.json version: $ROOT_VERSION"
          echo "Backend package.json version: $BACKEND_VERSION"
          echo "Release tag version: ${{ steps.version.outputs.version }}"
          if [ "$ROOT_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "ERROR: root package.json version ($ROOT_VERSION) does not match release tag version (${{ steps.version.outputs.version }})"
            exit 1
          fi

      - name: Verify CHANGELOG
        run: |
          if [ ! -f "CHANGELOG.md" ]; then
            echo "ERROR: CHANGELOG.md is required for releases"
            exit 1
          fi
          if ! grep -qi "${{ steps.version.outputs.version }}" CHANGELOG.md; then
            echo "WARNING: version ${{ steps.version.outputs.version }} not found in CHANGELOG.md"
          else
            echo "CHANGELOG contains version ${{ steps.version.outputs.version }}"
          fi

  build-artifacts:
    name: Build release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Setup Node env (root + backend)
        uses: ./.github/actions/setup-node-env
        with:
          node-version: '20.18.1'
          enable-backend: true

      - name: Build web
        run: npm run build
        env:
          NEXT_PUBLIC_TRPC_URL: /api/trpc
          NEXTAUTH_URL: https://example.com

      - name: Build backend
        run: npm run build:backend
        working-directory: backend

      - name: Generate tarball
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          mkdir -p release
          ARCHIVE_PATHS=".next public next.config.ts backend/dist backend/package.json backend/tsconfig.build.json prisma prisma.config.ts package.json package-lock.json"
          [ -d "out" ] && ARCHIVE_PATHS="$ARCHIVE_PATHS out"
          tar -czf "release/cfs-wms-${VERSION}.tar.gz" $ARCHIVE_PATHS

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: release-artifacts
          path: release
          retention-days: 90

  github-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [validate, build-artifacts]
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: release-artifacts
          path: release

      - name: Create GitHub release
        uses: softprops/action-gh-release@cfea534fc28a620b6f4e5aceaf93593622e1b791  # v2.2.2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          name: TradeOps CFS WMS ${{ needs.validate.outputs.tag }}
          body_path: CHANGELOG.md
          files: release/*
          prerelease: ${{ needs.validate.outputs.channel == 'beta' }}
          make_latest: ${{ needs.validate.outputs.channel == 'stable' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}