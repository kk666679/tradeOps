name: Lint

on:
  push:
    branches: [main]
    paths:
      - '**.ts'
      - '**.tsx'
      - '**.js'
      - '**.mjs'
      - '.github/workflows/lint.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eslint:
    name: ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4  # 11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node env (root + backend)
        uses: ./.github/actions/setup-node-env@main
        with:
          node-version-file: '.nvmrc'
          enable-backend: true

      - name: Install ESLint config
        run: npm install --no-save --no-package-lock eslint@^9 @eslint/js typescript-eslint@^8

      - name: Lint backend
        run: npx eslint "backend/src/**/*.ts" "backend/test/**/*.ts" --max-warnings=0
        continue-on-error: false

      - name: Lint web (Next.js)
        run: npx next lint --dir . --max-warnings=0
        continue-on-error: false

  prettier:
    name: Prettier
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4  # 11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node env (root + backend)
        uses: ./.github/actions/setup-node-env@main
        with:
          node-version-file: '.nvmrc'
          enable-backend: true

      - name: Install Prettier
        run: npm install --no-save --no-package-lock prettier@^3

      - name: Check formatting
        run: npx prettier --check "**/*.{ts,tsx,js,mjs,json,prisma}" --ignore-path .gitignore
        continue-on-error: false