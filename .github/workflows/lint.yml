name: Formatting and Typecheck

on:
  push:
    branches: [main]
    paths:
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.js'
      - '**/*.mjs'
      - '.github/workflows/lint.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'backend/package.json'
      - 'backend/package-lock.json'
      - 'tsconfig*.json'
      - 'backend/tsconfig*.json'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4  # 11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node env (root + backend)
        uses: ./.github/actions/setup-node-env
        with:
          node-version: '22.12.0'
          enable-backend: true

      - name: Typecheck web
        run: pnpm exec tsc --noEmit -p tsconfig.json

      - name: Typecheck backend
        run: pnpm exec tsc --noEmit -p backend/tsconfig.json

  prettier:
    name: Prettier
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4  # 11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node env (root + backend)
        uses: ./.github/actions/setup-node-env
        with:
          node-version: '22.12.0'
          enable-backend: true

      - name: Install Prettier
        run: npm install --no-save --package-lock=false prettier@^3

      - name: Check formatting
        run: npx prettier --check "**/*.{ts,tsx,js,mjs,json,prisma}" --ignore-path .gitignore
        continue-on-error: false
