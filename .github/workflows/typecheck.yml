name: Typecheck

on:
  push:
    branches: [main]
    paths:
      - '**.ts'
      - '**.tsx'
      - 'tsconfig*.json'
      - 'package.json'
      - 'backend/package.json'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: typecheck-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-web:
    name: Typecheck (web)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4  # 11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node env
        uses: ./.github/actions/setup-node-env
        with:
          node-version: '22.12.0'

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json
        env:
          # Skip Next's type generation so the check is fast and offline.
          NEXT_TELEMETRY_DISABLED: '1'

  typecheck-backend:
    name: Typecheck (backend)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4  # 11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node env (root + backend)
        uses: ./.github/actions/setup-node-env
        with:
          node-version: '22.12.0'
          enable-backend: true

      - name: Typecheck
        run: npx tsc --noEmit -p backend/tsconfig.json