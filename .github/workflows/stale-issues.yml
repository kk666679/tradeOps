name: Stale Issues

on:
  schedule:
    # Every Monday 04:00 UTC
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

concurrency:
  group: stale-issues
  cancel-in-progress: true

jobs:
  stale:
    name: Mark stale issues and PRs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Mark stale issues and PRs
        uses: actions/stale@v9  # a20b814fb01b71def3bd6f56e7494d667ddf28da
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-issue-stale: 30
          days-before-pr-stale: 14
          days-before-issue-close: 7
          days-before-pr-close: 7
          stale-issue-message: |
            Hi! This issue has been automatically marked as **stale** because it has
            had no activity for 30 days.

            If this issue is still relevant, please:
            1. Add a comment with any new context or reproduction steps.
            2. Update the labels so the right team can triage it.

            If nothing happens in the next 7 days, this issue will be closed to
            keep the backlog manageable.

            Thank you — the TradeOps CFS WMS maintainers.
          close-issue-message: |
            This issue has been automatically closed due to inactivity.

            If you believe this is in error or have new information, please
            reopen it and add a comment. Thank you!
          stale-pr-message: |
            This pull request has been automatically marked as **stale** because it
            has had no activity for 14 days.

            If you are still working on this, please add a comment or refresh the
            branch. Otherwise it will be closed in 7 days.

            Thank you!
          close-pr-message: |
            This pull request has been automatically closed due to inactivity.

            If you would like to continue working on this, please reopen it and
            add a comment. Thank you!
          operations-permission: write
          exempt-issue-labels: |
            security
            regulatory
            tariff
            blocked
            wip
            good-first-issue
          exempt-pr-labels: |
            security
            regulatory
            tariff
            blocked
            wip
            draft