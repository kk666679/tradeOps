name: Docker Build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'Dockerfile.*'
      - 'docker-compose*.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'backend/package.json'
      - 'backend/package-lock.json'
      - 'prisma/**'
      - 'prisma.config.ts'
      - 'next.config.ts'
      - '.github/workflows/docker-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile.*'
      - 'docker-compose*.yml'
      - 'package.json'
      - 'backend/package.json'
  workflow_dispatch:
    inputs:
      push:
        description: 'Push images to registry'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-web:
    name: Build web image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4  # 11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3  # TODO: pin to full commit SHA via .github/workflows/dependency-update.yml

      - name: Build web image
        uses: docker/build-push-action@v5  # TODO: pin to full commit SHA
        with:
          context: .
          file: Dockerfile.web
          target: runner
          load: true
          tags: cfs-wms:web
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Run Trivy vulnerability scan (web)
        uses: aquasecurity/trivy-action@v0.30.4  # TODO: pin to full commit SHA
        with:
          image-ref: cfs-wms:web
          format: sarif
          output: trivy-web.sarif
          severity: HIGH,CRITICAL
          exit-code: 1

      - name: Upload Trivy SARIF (web)
        if: always()
        uses: actions/upload-artifact@v4  # ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trivy-web
          path: trivy-web.sarif
          retention-days: 14

  build-backend:
    name: Build backend image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4  # 11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3  # TODO: pin to full commit SHA

      - name: Build backend image
        uses: docker/build-push-action@v5  # TODO: pin to full commit SHA
        with:
          context: .
          file: Dockerfile.backend
          target: runner
          load: true
          tags: cfs-wms:backend
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Run Trivy vulnerability scan (backend)
        uses: aquasecurity/trivy-action@v0.30.4  # TODO: pin to full commit SHA
        with:
          image-ref: cfs-wms:backend
          format: sarif
          output: trivy-backend.sarif
          severity: HIGH,CRITICAL
          exit-code: 1

      - name: Upload Trivy SARIF (backend)
        if: always()
        uses: actions/upload-artifact@v4  # ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trivy-backend
          path: trivy-backend.sarif
          retention-days: 14

  compose-validation:
    name: Validate docker-compose.prod.yml
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4  # 11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3  # TODO: pin to full commit SHA

      - name: Validate compose file
        run: docker compose -f docker-compose.prod.yml config > /dev/null

      - name: Build all images (compose)
        run: docker compose -f docker-compose.prod.yml build