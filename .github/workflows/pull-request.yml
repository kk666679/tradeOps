name: Pull Request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  label:
    name: Auto-label
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4  # 11d5960a326750d5838078e36cf38b85af677262

      - name: Apply labels
        uses: actions/labeler@v5  # ac9175f8a1f3625fd0d4fb234536d26811351594
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml

  size-label:
    name: PR size
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.pull_request.head.repo.fork == false
    steps:
      - name: Compute size and add label
        uses: actions/github-script@v7  # 10b53a9ec6c222bb4ce97aa6bd2b5f739696b536
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: files } = await github.rest.pulls.requestedFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const additions = files.reduce((sum, f) => sum + f.additions, 0);
            let label = 'xs';
            if (additions >= 1000) label = 'XXL';
            else if (additions >= 500) label = 'XL';
            else if (additions >= 100) label = 'L';
            else if (additions >= 50) label = 'M';
            else if (additions >= 10) label = 'S';
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels: [`size:${label}`],
            });
            console.log(`PR size: ${additions} additions -> ${label}`);

  first-interaction:
    name: First interaction
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: First PR comment
        uses: actions/first-interaction@v1  # 1c4688942c71f71d4f5502a26ea67c331730fa4d
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          pr_message: |
            Thanks for your first contribution to TradeOps CFS WMS!

            Before this can be merged, please confirm:
            1. You have run `npm run build` and `npm run lint` locally.
            2. You have run the test suite that is relevant to your change.
            3. You have read and followed the [security policy](./SECURITY.md).
            4. No secrets, credentials, or tariff data fixtures have been committed.

            A maintainer will review shortly.
          issue_message: |
            Thanks for opening your first issue. A maintainer will triage it shortly.